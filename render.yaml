# نشر خادم المزامنة على Render (Blueprint). القرص الدائم يتطلب خطة مدفوعة؛ بدونه تضيع البيانات عند كل إعادة نشر.
services:
  - type: web
    name: hr-sync
    runtime: node
    rootDir: server
    buildCommand: "true"
    startCommand: node server.js
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: SETUP_KEY
        generateValue: true
    disk:
      name: hr-data
      mountPath: /var/data
      sizeGB: 1
