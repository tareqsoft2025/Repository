<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الحضور والانصراف</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="auth-body">
    <div class="login-container">
        <h2>نظام الحضور والانصراف</h2>
        <form id="loginForm">
            <div class="field">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            <div class="error-message" id="error">اسم المستخدم أو كلمة المرور غير صحيحة</div>
            <button type="submit" class="btn full">دخول</button>
        </form>
        <p class="hint">
            حسابات تجريبية:<br>
            مدير: <b dir="ltr">admin / admin123</b><br>
            موظف: <b dir="ltr">ahmed / 123456</b>
        </p>
    </div>
    <script src="js/store.js"></script>
    <script>
        if (Store.currentUser()) location.replace('index.html');
        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            const u = Store.login(document.getElementById('username').value, document.getElementById('password').value);
            if (u) location.replace('index.html');
            else document.getElementById('error').style.display = 'block';
        });
    </script>
</body>
</html>
